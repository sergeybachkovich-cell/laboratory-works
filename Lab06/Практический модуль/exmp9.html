<html>
<head>
<title>Example 9</title>
</head>
<body>
<!-- Определение названия месяца по его номеру-->
<script type="text/javascript">
var n = parseInt(prompt('Введите номер месяца от 1 до 12:', 12));
switch (n) {
case 1:
document.write('Январь');
break;
case 2:
document.write('Февраль');
break;
case 3:
document.write('Март');
break;
case 4:
document.write('Апрель');
break;
case 5:
document.write('Май');
break;
case 6:
document.write('Июнь');
break;
case 7:
document.write('Июль');
break;
case 8:
document.write('Август');
break;
case 9:
document.write('Сентябрь');
break;
case 10:
document.write('Октябрь');
break;
case 11:
document.write('Ноябрь');
break;
case 12:
document.write('Декабрь');
break;
default :
document.write('Месяц не определен');
}
</script>
</body>
</html>
