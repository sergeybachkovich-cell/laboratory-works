<title>Example 8</title>
</head>
<body>
<!-- Вычисление факториал-->
<script type="text/javascript">
var n = parseInt(prompt('Введите целое число:', 5));
var factorial = 1;
for (var i = 1; i <= n; i++){
factorial *= i;
}
document.write('Факториал ' + n + '! равен ' + factorial);
</script>
</body>
</html>
