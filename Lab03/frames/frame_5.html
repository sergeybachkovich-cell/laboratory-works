<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
    <meta charset="UTF-8">
    <title>Справка</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="info-container">
        <div class="info-title">Справка</div>
        <p class="info-hint">Нажмите "?" для получения информации</p>
        
        <a name="fio"></a>
        <div id="fio" class="info-block active">
            <h4>Ф.И.О.</h4>
            <p>Понтелеенко Сергей Владимирович</p>
        </div>
        
        <a name="activity"></a>
        <div id="activity" class="info-block">
            <h4>Область деятельности</h4>
            <p>Выберите из списка: IT, Медицина, Физика</p>
        </div>
        
        <a name="year"></a>
        <div id="year" class="info-block">
            <h4>Год рождения</h4>
            <p>Формат: ГГГГ. Пример: 1990</p>
        </div>
        
        <a name="country"></a>
        <div id="country" class="info-block">
            <h4>Страна</h4>
            <p>Название страны. Максимум 30 символов</p>
        </div>
        
        <a name="pub"></a>
        <div id="pub" class="info-block">
            <h4>Число публикаций</h4>
            <p>Целое число. Пример: 15</p>
        </div>
    </div>
</body>
</html>
